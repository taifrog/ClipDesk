name: Deploy to GitHub Pages and Supabase

on:
  push:
    branches:
      - main

  # 手動実行も可能
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # フロントエンドをビルドして GitHub Pages にデプロイする
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      # 本番ビルド時に GitHub Secrets から環境変数を注入する
      - name: フロントエンドをビルド
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: npm run build

      # SPA 用のフォールバックページを作成する
      - name: SPA フォールバックを追加
        run: cp docs/index.html docs/404.html

      # GitHub Pages 用にビルド成果物をアップロードする
      - name: GitHub Pages 用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      # GitHub Pages にデプロイする
      - name: GitHub Pages にデプロイ
        id: deployment
        uses: actions/deploy-pages@v4

  # データベースマイグレーションと Edge Functions をデプロイ
  deploy-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Supabase CLI をセットアップ
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # 本番 DB へのマイグレーション適用
      # supabase db push は --project-ref に対応していないため、link してから実行する
      - name: プロジェクトをリンクしてマイグレーションを適用
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push

      # Edge Functions から利用する環境変数を登録する
      # SUPABASE_ プレフィックスは予約語のため SB_ プレフィックスを使用する
      - name: Edge Functions 用 Secrets を設定
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
            SB_URL="https://${SUPABASE_PROJECT_ID}.supabase.co" \
            SB_ANON_KEY="$VITE_SUPABASE_ANON_KEY" \
            SB_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY"

      # Edge Functions をデプロイ
      - name: Edge Functions をデプロイ
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

  # Chrome 拡張機能をビルドして GitHub Releases に公開する
  release-addon:
    runs-on: ubuntu-latest
    needs: deploy-web
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: addon-chrome/package-lock.json

      - name: 拡張機能の依存パッケージをインストール
        working-directory: addon-chrome
        run: npm ci

      # ビルド時に Supabase URL を注入するため .env を生成する
      - name: 拡張機能用 .env を生成
        working-directory: addon-chrome
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" > .env

      - name: 拡張機能をビルド
        working-directory: addon-chrome
        run: npm run build

      - name: 拡張機能を zip 化
        working-directory: addon-chrome
        run: zip -r clipdesk-addon-chrome.zip dist

      - name: バージョンを取得
        id: version
        working-directory: addon-chrome
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 同じバージョンのタグ・リリースが既存の場合は削除してから再作成する
      - name: 既存の拡張機能リリースを削除
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="addon-v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -d "$TAG"
            git push --delete origin "$TAG" || true
          fi

      - name: GitHub Release を作成
        uses: softprops/action-gh-release@v2
        with:
          tag_name: addon-v${{ steps.version.outputs.version }}
          name: ClipDesk Chrome Addon v${{ steps.version.outputs.version }}
          files: addon-chrome/clipdesk-addon-chrome.zip
          generate_release_notes: true
          make_latest: false
