name: Deploy to GitHub Pages and Supabase

on:
  push:
    branches:
      - main

  # 手動実行も可能
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # フロントエンドをビルドして docs/ に出力し、main ブランチにコミットして GitHub Pages 公開用とする
  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      # 本番ビルド時に GitHub Secrets から環境変数を注入する
      - name: フロントエンドをビルド
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # SPA 用のフォールバックページを作成する
      - name: SPA フォールバックを追加
        run: cp docs/index.html docs/404.html

      # docs/ フォルダを GitHub Pages 公開用に main ブランチへコミット
      # [skip ci] を付与して無限ループを防ぐ
      - name: docs/ をコミットしてプッシュ
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to docs/"
          else
            git commit -m "chore: deploy to docs/ [skip ci]"
            git push origin main
          fi

  # データベースマイグレーションと Edge Functions をデプロイ
  deploy-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Supabase CLI をセットアップ
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # 本番 DB へのマイグレーション適用
      # supabase db push は --project-ref に対応していないため、link してから実行する
      - name: プロジェクトをリンクしてマイグレーションを適用
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push

      # Edge Functions から利用する環境変数を登録する
      # SUPABASE_URL / SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY を設定
      - name: Edge Functions 用 Secrets を設定
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" \
            SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co" \
            SUPABASE_ANON_KEY="$VITE_SUPABASE_ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY"

      # Edge Functions をデプロイ
      - name: Edge Functions をデプロイ
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
